name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. 68cce049c8 or leave blank for short commit hash)"
        required: false
        default: ""
  push:
    tags: ["*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: build windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: determine tag and version
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag -and "$env:GITHUB_REF" -like "refs/tags/*") {
            $tag = "$env:GITHUB_REF".Replace("refs/tags/", "")
          }
          if (-not $tag) {
            $tag = (git rev-parse --short=10 HEAD).Trim()
          }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          Write-Host "Target Tag: $tag"

      - uses: dtolnay/rust-toolchain@stable

      - name: install rust targets
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64-poly
          cache-on-failure: true

      - name: build poly executable
        env:
          POLY_VERSION: ${{ env.TAG }}
        run: cargo build --release --locked --package poly --target x86_64-pc-windows-msvc

      - name: ensure inno setup
        shell: pwsh
        run: |
          $iscc = @(
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6/ISCC.exe"),
            (Join-Path $env:LOCALAPPDATA "Programs/Inno Setup 6/ISCC.exe")
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
          }

      - name: build inno setup installer
        shell: pwsh
        env:
          TAG: ${{ env.TAG }}
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/windows/build-installer.ps1 -Version $env:TAG -Executable "target/x86_64-pc-windows-msvc/release/poly.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/Poly-Windows.exe
            dist/Poly-Setup.exe

  linux:
    name: build linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: determine tag and version
        id: meta
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$(git rev-parse --short=10 HEAD)"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Target Release Tag: $TAG"

      - name: system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake mold \
            libasound2-dev libfontconfig1-dev libfreetype-dev libsqlite3-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libdbus-1-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: install rust targets
        run: rustup target add x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x64-poly
          cache-on-failure: true

      - name: build poly executable
        env:
          POLY_VERSION: ${{ env.TAG }}
        run: cargo build --release --locked --package poly --target x86_64-unknown-linux-gnu --features bundled-sqlite

      - name: package linux tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/bin staging/share/applications staging/share/icons/hicolor
          cp target/x86_64-unknown-linux-gnu/release/poly staging/bin/poly
          chmod +x staging/bin/poly

          if [ -f assets/linux/poly.desktop ]; then
            cp assets/linux/poly.desktop staging/share/applications/
          elif [ -f assets/linux/sonora.desktop ]; then
            cp assets/linux/sonora.desktop staging/share/applications/poly.desktop
          fi

          if [ -d assets/linux/icons/hicolor ]; then
            cp -r assets/linux/icons/hicolor/* staging/share/icons/hicolor/
          fi

          cp COPYING staging/LICENSE
          cp THIRD-PARTY.md staging/
          if [ -f assets/fonts/LICENSE.txt ]; then
            cp assets/fonts/LICENSE.txt staging/LICENSE.Inter
          fi

          mkdir -p dist
          tar -czf "dist/Poly-Linux.tar.gz" -C staging .

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/Poly-Linux.tar.gz

  macos:
    name: build universal macos dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: determine tag and version
        id: meta
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$(git rev-parse --short=10 HEAD)"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Target Release Tag: $TAG"

      - uses: dtolnay/rust-toolchain@stable

      - name: install rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-poly
          cache-on-failure: true

      - name: compile apple silicon (arm64)
        env:
          POLY_VERSION: ${{ env.TAG }}
        run: cargo build --release --locked --package poly --target aarch64-apple-darwin

      - name: compile intel (x86_64)
        env:
          POLY_VERSION: ${{ env.TAG }}
        run: cargo build --release --locked --package poly --target x86_64-apple-darwin

      - name: assemble universal poly.app bundle
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p Poly.app/Contents/MacOS Poly.app/Contents/Resources

          if [ -f "target/aarch64-apple-darwin/release/poly" ] && [ -f "target/x86_64-apple-darwin/release/poly" ]; then
            lipo -create \
              -output Poly.app/Contents/MacOS/poly \
              target/aarch64-apple-darwin/release/poly \
              target/x86_64-apple-darwin/release/poly
          else
            cp target/aarch64-apple-darwin/release/poly Poly.app/Contents/MacOS/poly 2>/dev/null || cp target/x86_64-apple-darwin/release/poly Poly.app/Contents/MacOS/poly
          fi
          chmod +x Poly.app/Contents/MacOS/poly
          lipo -info Poly.app/Contents/MacOS/poly

          if [ -f assets/macos/poly.icns ]; then
            cp assets/macos/poly.icns Poly.app/Contents/Resources/poly.icns
          elif [ -f assets/macos/sonora.icns ]; then
            cp assets/macos/sonora.icns Poly.app/Contents/Resources/poly.icns
          fi

          cp COPYING Poly.app/Contents/Resources/LICENSE
          cp THIRD-PARTY.md Poly.app/Contents/Resources/
          if [ -f assets/fonts/LICENSE.txt ]; then
            cp assets/fonts/LICENSE.txt Poly.app/Contents/Resources/LICENSE.Inter
          fi

          mkdir -p Poly.app/Contents/Resources/icons
          if [ -f assets/icons/LICENSE ]; then
            cp assets/icons/LICENSE Poly.app/Contents/Resources/icons/LICENSE
          fi
          for licence in assets/icons/*/LICENSE; do
            if [ -f "$licence" ]; then
              pack="$(basename "$(dirname "$licence")")"
              cp "$licence" "Poly.app/Contents/Resources/icons/LICENSE.$pack"
            fi
          done

          sed "s/@VERSION@/$TAG/g" assets/macos/Info.plist > Poly.app/Contents/Info.plist
          plutil -lint Poly.app/Contents/Info.plist

      - name: ad-hoc codesign
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --deep --sign - Poly.app
          codesign --verify --strict --verbose=2 Poly.app

      - name: create dmg and zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist staging
          cp -R Poly.app staging/
          ln -s /Applications staging/Applications
          megabytes=$(du -ms staging | cut -f1)
          hdiutil create \
            -volname "Poly" \
            -srcfolder staging \
            -size "$((megabytes + 64))m" \
            -ov \
            -format UDZO \
            "dist/Poly-macOS.dmg"

          cd staging
          zip -r -y -q "../dist/Poly-macOS.zip" Poly.app
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/Poly-macOS.dmg
            dist/Poly-macOS.zip

  publish:
    name: publish release
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: determine tag
        id: meta
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$(git rev-parse --short=10 HEAD)"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Target Release Tag: $TAG"

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: compute unified checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 * > SHA256SUMS
          cat SHA256SUMS
          cd ..

      - name: publish to github release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          if ! gh release view "$TAG" 2>/dev/null; then
            gh release create "$TAG" * \
              --title "Poly $TAG" \
              --notes "### Poly $TAG Release - Cross-platform builds for Windows, macOS, and Linux"
          else
            gh release upload "$TAG" * --clobber
          fi
